name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
        vitest: [2.1.9, 3.2.4, 4.1.10]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install test framework version
        run: |
          if [[ "${{ matrix.vitest }}" == 4.* ]]; then
            pnpm add --save-dev --lockfile=false "vitest@${{ matrix.vitest }}" "vite@7.3.6"
          else
            pnpm add --save-dev --lockfile=false "vitest@${{ matrix.vitest }}"
          fi
      - run: pnpm test
      - run: pnpm build
      - run: npm pack --dry-run
      - name: Test installed package
        run: |
          package="$(npm pack --silent)"
          consumer="$RUNNER_TEMP/bdd-vitest-consumer"
          mkdir -p "$consumer"
          cp test/package-smoke/* "$consumer/"
          cd "$consumer"
          npm init -y
          npm install "$GITHUB_WORKSPACE/$package" "vitest@${{ matrix.vitest }}"
          npx vitest run --reporter=dot
          cp "$GITHUB_WORKSPACE/test/fixtures/reporter-override/native.test.ts" .
          if npx vitest run --reporter=dot; then
            echo "Native test bypassed the installed package contract" >&2
            exit 1
          fi
